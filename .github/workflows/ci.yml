name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_pages.py -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.USE_COOLIFY_WEBHOOK == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          curl --fail --show-error --silent --retry 3 "$COOLIFY_DEPLOY_WEBHOOK"
